name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shell }} on Windows Server 2025
    # Stable OS family; exact image/OS/host versions are recorded by the runners.
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      WINIMG_CI_RUNNER_LABEL: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0; official tag/commit verified 2026-10-05
        with:
          persist-credentials: false
      - name: Run mandatory tests with verified development dependencies
        run: |
          ./tests/Invoke-Tests.ps1 -DownloadDependencies -ResultDirectory .scratch/ci-tests
      - name: Run scoped static analysis with verified development dependencies
        if: ${{ !cancelled() }}
        run: |
          ./tests/Invoke-StaticAnalysis.ps1 -DownloadDependencies -ResultDirectory .scratch/ci-analysis
      - name: Prove a broken assertion returns failure
        if: ${{ !cancelled() }}
        run: |
          $hostExecutable = (Get-Process -Id $PID).Path
          & $hostExecutable -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Invoke-Tests.ps1 -DeliberateFailure -ResultDirectory .scratch/ci-deliberate-failure
          $controlExit = $LASTEXITCODE
          $control = Get-Content -LiteralPath .scratch/ci-deliberate-failure/summary.json -Raw | ConvertFrom-Json
          $normal = Get-Content -LiteralPath .scratch/ci-tests/summary.json -Raw | ConvertFrom-Json
          if ($normal.exit_code -ne 0 -or $controlExit -ne 1 -or $control.exit_code -ne 1 -or $control.total_count -ne ($normal.total_count + 1) -or $control.passed_count -ne $normal.passed_count -or $control.failed_count -ne 1 -or $control.skipped_count -ne 0 -or $control.inconclusive_count -ne 0 -or $control.not_run_count -ne 0 -or $control.failed_blocks_count -ne 0 -or $control.failed_containers_count -ne 0 -or $control.infrastructure_error) {
            throw 'The deliberate assertion control did not produce exactly the expected real test failure.'
          }
          if (@($control.failed_tests | Where-Object { $_ -eq 'T007 runner credibility control.deliberate assertion must fail' }).Count -ne 1) {
            throw 'The failure did not come from the deliberate assertion.'
          }
          Write-Host 'Verified: the deliberately false assertion failed and the runner returned exit 1.'
          $global:LASTEXITCODE = 0
      - name: Prove an unsafe expression returns analysis failure
        if: ${{ !cancelled() }}
        run: |
          $hostExecutable = (Get-Process -Id $PID).Path
          & $hostExecutable -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Invoke-StaticAnalysis.ps1 -DeliberateFailure -ResultDirectory .scratch/ci-analysis-control
          $controlExit = $LASTEXITCODE
          $control = Get-Content -LiteralPath .scratch/ci-analysis-control/static-analysis-summary.json -Raw | ConvertFrom-Json
          if ($controlExit -ne 1 -or $control.exit_code -ne 1 -or $control.result -ne 'analysis_failed' -or $control.scoped_findings_count -ne 0 -or $control.control_findings_count -ne 1 -or $control.findings_count -ne 1 -or -not $control.control_detected -or $control.infrastructure_error) {
            throw 'The static analysis control did not produce exactly the expected unsafe-expression finding.'
          }
          if (@($control.findings | Where-Object { $_.source -eq 'control/unsafe-expression.ps1' -and $_.rule -eq 'PSAvoidUsingInvokeExpression' -and $_.severity -eq 'Warning' }).Count -ne 1) {
            throw 'The analysis failure did not come from the intended control.'
          }
          Write-Host 'Verified: the unsafe expression was detected without execution and analysis returned exit 1.'
          $global:LASTEXITCODE = 0
      - name: Export allowlisted synthetic evidence
        if: ${{ !cancelled() }}
        run: |
          ./tests/Export-TestEvidence.ps1 -ResultDirectories @('.scratch/ci-tests', '.scratch/ci-deliberate-failure') -StaticAnalysisDirectories @('.scratch/ci-analysis', '.scratch/ci-analysis-control') -OutputDirectory .scratch/ci-export
      - name: Upload sanitized synthetic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; official tag/commit and upload sources reviewed 2026-10-05
        with:
          name: synthetic-evidence-${{ matrix.shell }}-${{ github.sha }}
          path: |
            .scratch/ci-export/test-evidence.json
            .scratch/ci-export/static-analysis-evidence.json
          # Explicit filenames only; .scratch is a dot directory. The exporter
          # rejects links and copies bounded fields, never raw logs/XML/media.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: false
